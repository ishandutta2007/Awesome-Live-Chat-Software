<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360" style="background:#090d16;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;border-radius:14px;overflow:hidden"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#070a12"/></linearGradient><linearGradient id="primaryGlow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="bubbleGrad1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0284c7" stop-opacity=".8"/><stop offset="100%" stop-color="#2563eb" stop-opacity=".9"/></linearGradient><linearGradient id="bubbleGrad2" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#3b82f6" stop-opacity=".25"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity=".2"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".4" stroke-width=".75" d="M 40 0 L 0 0 0 40"/></pattern></defs><style>@keyframes floatSlow{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(1.5deg)}}@keyframes floatReverse{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(10px) rotate(-1.5deg)}}@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.7;transform:scale(1.08)}}@keyframes typingDot{0%,80%{opacity:.2;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}@keyframes waveMove{0%{transform:translateX(0)}50%{transform:translateX(-35px)}}@keyframes pingBadge{0%{transform:scale(.95);opacity:.8}50%{transform:scale(1.05);opacity:1}}.bg-glow,.bubble-1,.bubble-2{transform-origin:center}.bubble-1{animation:floatSlow 6s ease-in-out infinite}.bubble-2{animation:floatReverse 7s ease-in-out infinite}.bg-glow{animation:pulseGlow 5s ease-in-out infinite}.dot-1{animation:typingDot 1.4s infinite ease-in-out}.dot-2{animation:typingDot 1.4s infinite ease-in-out .2s}.dot-3{animation:typingDot 1.4s infinite ease-in-out .4s}.stream-wave{animation:waveMove 10s ease-in-out infinite}.online-badge{animation:pingBadge 2.5s ease-in-out infinite}</style><rect width="100%" height="100%" fill="url(#bgGradient)"/><rect width="100%" height="100%" fill="url(#grid)"/><g class="bg-glow"><circle cx="200" cy="80" r="140" fill="#0284c7" filter="blur(60px)" opacity=".22"/><circle cx="1020" cy="270" r="160" fill="#7c3aed" filter="blur(65px)" opacity=".25"/><circle cx="620" cy="180" r="120" fill="#06b6d4" filter="blur(55px)" opacity=".15"/></g><g class="stream-wave" opacity=".25"><path fill="none" stroke="url(#primaryGlow)" stroke-dasharray="8 6" stroke-width="2" d="M-50,280 C250,220 450,330 750,270 C950,230 1150,300 1300,260"/></g><g class="bubble-1" transform="translate(860, 55)"><rect width="280" height="95" fill="#131c31" stroke="#2563eb" stroke-opacity=".6" stroke-width="1.2" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.5))" rx="18"/><circle cx="36" cy="38" r="18" fill="url(#bubbleGrad1)"/><path fill="#fff" d="M28,38 C28,34 32,31 36,31 C40,31 44,34 44,38 C44,42 41,45 36,45 C32,45 28,42 28,38 Z"/><circle cx="33" cy="37" r="1.5" fill="#0f172a"/><circle cx="39" cy="37" r="1.5" fill="#0f172a"/><text x="66" y="34" fill="#f8fafc" font-size="13" font-weight="600">AI Support Copilot</text><rect width="130" height="7" x="66" y="44" fill="#334155" rx="3.5"/><rect width="180" height="7" x="66" y="57" fill="#1e293b" rx="3.5"/><g transform="translate(210, 31)"><circle cx="0" cy="0" r="3" fill="#38bdf8" class="dot-1"/><circle cx="8" cy="0" r="3" fill="#818cf8" class="dot-2"/><circle cx="16" cy="0" r="3" fill="#c084fc" class="dot-3"/></g></g><g class="bubble-2" transform="translate(890, 180)"><rect width="250" height="90" fill="#0f172a" stroke="#334155" stroke-opacity=".7" stroke-width="1.2" filter="drop-shadow(0 12px 20px rgba(0,0,0,0.6))" rx="18"/><circle cx="34" cy="35" r="16" fill="#10b981"/><text x="29" y="40" fill="#fff" font-size="14" font-weight="700">✓</text><text x="62" y="32" fill="#e2e8f0" font-size="13" font-weight="600">Visitor Connected</text><text x="62" y="50" fill="#94a3b8" font-size="11">Real-time omnichannel sync</text><rect width="110" height="6" x="62" y="62" fill="#0284c7" fill-opacity=".5" rx="3"/><circle cx="225" cy="28" r="5" fill="#22c55e" class="online-badge"/></g><g transform="translate(70, 70)"><g><rect width="245" height="30" fill="#1e293b" stroke="#38bdf8" stroke-opacity=".4" stroke-width="1" rx="15"/><circle cx="16" cy="15" r="4.5" fill="#38bdf8" class="online-badge"/><text x="28" y="20" fill="#7dd3fc" font-size="11.5" font-weight="700" letter-spacing="1">CURATED SOFTWARE DIRECTORY</text></g><text x="0" y="85" fill="#fff" font-size="46" font-weight="800" letter-spacing="-.5">Awesome Live Chat Software</text><rect width="480" height="4" x="0" y="105" fill="url(#primaryGlow)" rx="2"/><text x="0" y="142" fill="#cbd5e1" font-size="18" font-weight="400">Enterprise SaaS Marketplaces &amp; Self-Hosted Open-Source Platforms</text><text x="0" y="172" fill="#94a3b8" font-size="14" font-weight="400">Real-Time Messaging • Omnichannel Inbox • AI Chatbots • Data Sovereignty</text><g transform="translate(0, 205)"><rect width="135" height="28" x="0" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/><text x="14" y="18" fill="#38bdf8" font-size="12" font-weight="600">⚡ Top SaaS Tools</text><rect width="155" height="28" x="145" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/><text x="157" y="18" fill="#a78bfa" font-size="12" font-weight="600">🚀 100% Open Source</text><rect width="145" height="28" x="310" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/><text x="322" y="18" fill="#34d399" font-size="12" font-weight="600">🛡️ Self-Hosted Ready</text></g></g></svg>