<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; border-radius:14px; overflow:hidden;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="bubbleGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="bubbleGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    /* Dynamic Floating Animation */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1.5deg); }
    }
    @keyframes floatReverse {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(10px) rotate(-1.5deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }
    @keyframes typingDot {
      0%, 80%, 100% { opacity: 0.2; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-4px); }
    }
    @keyframes waveMove {
      0% { transform: translateX(0); }
      50% { transform: translateX(-35px); }
      100% { transform: translateX(0); }
    }
    @keyframes pingBadge {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    .bubble-1 { animation: floatSlow 6s ease-in-out infinite; transform-origin: center; }
    .bubble-2 { animation: floatReverse 7s ease-in-out infinite; transform-origin: center; }
    .bg-glow { animation: pulseGlow 5s ease-in-out infinite; transform-origin: center; }
    .dot-1 { animation: typingDot 1.4s infinite ease-in-out; }
    .dot-2 { animation: typingDot 1.4s infinite ease-in-out 0.2s; }
    .dot-3 { animation: typingDot 1.4s infinite ease-in-out 0.4s; }
    .stream-wave { animation: waveMove 10s ease-in-out infinite; }
    .online-badge { animation: pingBadge 2.5s ease-in-out infinite; }
  </style>

  <!-- Deep Canvas Base -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Dynamic Ambient Glows (Behind all content) -->
  <g class="bg-glow">
    <circle cx="200" cy="80" r="140" fill="#0284c7" opacity="0.22" filter="blur(60px)" />
    <circle cx="1020" cy="270" r="160" fill="#7c3aed" opacity="0.25" filter="blur(65px)" />
    <circle cx="620" cy="180" r="120" fill="#06b6d4" opacity="0.15" filter="blur(55px)" />
  </g>

  <!-- Animated Chat Visual Elements (Background Layers) -->
  <g class="stream-wave" opacity="0.25">
    <path d="M-50,280 C250,220 450,330 750,270 C950,230 1150,300 1300,260" fill="none" stroke="url(#primaryGlow)" stroke-width="2" stroke-dasharray="8 6" />
  </g>

  <!-- Floating Dynamic Chat Bubble Card (Right Side) -->
  <g class="bubble-1" transform="translate(860, 55)">
    <!-- Shadow & Container -->
    <rect width="280" height="95" rx="18" fill="#131c31" stroke="#2563eb" stroke-width="1.2" stroke-opacity="0.6" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.5))" />
    <circle cx="36" cy="38" r="18" fill="url(#bubbleGrad1)" />
    <!-- Bot / Support Avatar Icon -->
    <path d="M28,38 C28,34 32,31 36,31 C40,31 44,34 44,38 C44,42 41,45 36,45 C32,45 28,42 28,38 Z" fill="#ffffff" />
    <circle cx="33" cy="37" r="1.5" fill="#0f172a" />
    <circle cx="39" cy="37" r="1.5" fill="#0f172a" />
    <text x="66" y="34" fill="#f8fafc" font-size="13" font-weight="600">AI Support Copilot</text>
    <rect x="66" y="44" width="130" height="7" rx="3.5" fill="#334155" />
    <rect x="66" y="57" width="180" height="7" rx="3.5" fill="#1e293b" />
    <!-- Typing Indicator Dots -->
    <g transform="translate(210, 31)">
      <circle class="dot-1" cx="0" cy="0" r="3" fill="#38bdf8" />
      <circle class="dot-2" cx="8" cy="0" r="3" fill="#818cf8" />
      <circle class="dot-3" cx="16" cy="0" r="3" fill="#c084fc" />
    </g>
  </g>

  <!-- Second Floating Dynamic Message Card -->
  <g class="bubble-2" transform="translate(890, 180)">
    <rect width="250" height="90" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.2" stroke-opacity="0.7" filter="drop-shadow(0 12px 20px rgba(0,0,0,0.6))" />
    <circle cx="34" cy="35" r="16" fill="#10b981" />
    <text x="29" y="40" fill="#ffffff" font-size="14" font-weight="700">✓</text>
    <text x="62" y="32" fill="#e2e8f0" font-size="13" font-weight="600">Visitor Connected</text>
    <text x="62" y="50" fill="#94a3b8" font-size="11">Real-time omnichannel sync</text>
    <rect x="62" y="62" width="110" height="6" rx="3" fill="#0284c7" fill-opacity="0.5" />
    <circle class="online-badge" cx="225" cy="28" r="5" fill="#22c55e" />
  </g>

  <!-- FOREGROUND: Content / Header (Guaranteed High Contrast & Fully Legible) -->
  <g transform="translate(70, 70)">
    <!-- Pill Category Badge -->
    <g>
      <rect width="245" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
      <circle class="online-badge" cx="16" cy="15" r="4.5" fill="#38bdf8" />
      <text x="28" y="20" fill="#7dd3fc" font-size="11.5" font-weight="700" letter-spacing="1">CURATED SOFTWARE DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="85" fill="#ffffff" font-size="46" font-weight="800" letter-spacing="-0.5">
      Awesome Live Chat Software
    </text>

    <!-- Gradient Accent Sub-bar -->
    <rect x="0" y="105" width="480" height="4" rx="2" fill="url(#primaryGlow)" />

    <!-- Subtitle / Tagline -->
    <text x="0" y="142" fill="#cbd5e1" font-size="18" font-weight="400">
      Enterprise SaaS Marketplaces &amp; Self-Hosted Open-Source Platforms
    </text>
    <text x="0" y="172" fill="#94a3b8" font-size="14" font-weight="400">
      Real-Time Messaging • Omnichannel Inbox • AI Chatbots • Data Sovereignty
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 205)">
      <!-- Badge 1: SaaS Leaders -->
      <rect x="0" y="0" width="135" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="14" y="18" fill="#38bdf8" font-size="12" font-weight="600">⚡ Top SaaS Tools</text>

      <!-- Badge 2: Open Source -->
      <rect x="145" y="0" width="155" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="157" y="18" fill="#a78bfa" font-size="12" font-weight="600">🚀 100% Open Source</text>

      <!-- Badge 3: Self-Hosted -->
      <rect x="310" y="0" width="145" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="322" y="18" fill="#34d399" font-size="12" font-weight="600">🛡️ Self-Hosted Ready</text>
    </g>
  </g>
</svg>
